<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3b2c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Super admin · Kris Kringle Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<canvas id="snow"></canvas>
<nav class="topbar">
  <a href="./" class="small">← My page</a>
  <span class="spacer"></span>
  <span class="muted" id="whoami"></span>
  <button class="small link" id="signOut">Sign out</button>
</nav>
<main>
  <header>
    <div class="lights" aria-hidden="true"><span>🔴</span><span>🟡</span><span>🟢</span><span>🔵</span><span>🔴</span><span>🟡</span><span>🟢</span></div>
    <h1><span class="family">Super admin</span>Kris Kringle Generator</h1>
    <p class="sub">Every family on the site. Their draws and wish lists stay private, even from here.</p>
  </header>

  <div id="error"></div>

  <section id="app" class="hidden">
    <h2>🏡 Families <small id="famCount"></small></h2>
    <div id="famMsg"></div>
    <ul class="list" id="families"></ul>
  </section>

  <footer>Merry Christmas 🎄</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
let state = null;

async function load() {
  state = await rpc("super_get_state");
  const n = state.families.length;
  $("famCount").textContent = `${n} ${n === 1 ? "family" : "families"}`;
  $("families").innerHTML = state.families.map(f => `
    <li style="display:block">
      <div class="row" style="justify-content:space-between">
        <div>
          <strong>${esc(f.name)}</strong>${f.mine ? ` <span class="muted">(you're in this one)</span>` : ""}
          <div class="muted">👥 ${f.people_count} ${f.people_count === 1 ? "person" : "people"} (${f.account_count} signed up) · 🎄 ${f.event_count} exchange${f.event_count === 1 ? "" : "s"} · started ${new Date(f.created_at).toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" })}</div>
          <div class="muted">Organisers: ${f.admins.map(a => `${esc(a.name)}${a.email ? ` (${esc(a.email)})` : ""}`).join(", ") || "none"}</div>
        </div>
        <button class="small link" data-del="${f.id}">Delete family</button>
      </div>
    </li>`).join("") || `<li class="empty">No families yet.</li>`;
  $("app").classList.remove("hidden");
}

$("families").addEventListener("click", async e => {
  const id = e.target.dataset.del;
  if (!id) return;
  const f = state.families.find(x => x.id === id);
  const typed = prompt(`This permanently deletes the ${f.name} family: all ${f.people_count} people, their wish lists and every exchange. It can't be undone.\n\nType the family name to confirm:`);
  if (typed === null) return;
  if (typed.trim().toLowerCase() !== f.name.toLowerCase()) { showMsg($("famMsg"), "Name didn't match, so nothing was deleted."); return; }
  try {
    await rpc("super_delete_family", { p_family: id });
    await load();
    showMsg($("famMsg"), `${f.name} family deleted.`, "ok");
  } catch (err) { showMsg($("famMsg"), err.message); }
});

$("signOut").addEventListener("click", signOut);

(async () => {
  const user = await requireUser();
  $("whoami").textContent = user.email;
  try { await load(); } catch (err) { showMsg($("error"), err.message); }
})();
</script>
</body>
</html>
