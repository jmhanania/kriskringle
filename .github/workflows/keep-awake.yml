# Free Supabase projects pause after 7 days without activity. This pings the database
# once a day so the site stays up between Christmases.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 9:17am Toronto time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # The publishable key is public (it's in config.js); ping() is the only thing it can call.
          curl --fail --silent --show-error -X POST \
            "https://lsjqvbochnoewzwgcygg.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_DbHkL4NtJVRBdDKhpAB9dw_C1Dp2bVW" \
            -H "Content-Type: application/json" -d '{}'
