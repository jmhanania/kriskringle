<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Kris Kringle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <header>
    <div class="lights" aria-hidden="true"><span>🔴</span><span>🟡</span><span>🟢</span><span>🔵</span><span>🔴</span><span>🟡</span><span>🟢</span></div>
    <h1><span class="family family-name"></span>Kris Kringle Generator</h1>
    <p class="sub">Admin page: manage the family, run the draw, send the links.</p>
  </header>

  <div id="error"></div>

  <div id="app" class="hidden">
    <section>
      <h2><span>👨‍👩‍👧‍👦 The family <small id="famCount"></small></span><button class="small link" id="renameFamily">Rename family</button></h2>
      <form id="personForm">
        <div class="row">
          <input type="text" id="pName" placeholder="Name" maxlength="80" required>
          <input type="email" id="pEmail" placeholder="Email (optional)" maxlength="200">
          <input type="tel" id="pPhone" placeholder="Mobile (optional)" maxlength="40">
        </div>
        <div class="row" style="margin-top:8px">
          <button type="submit" id="pSave">Add person</button>
          <button type="button" class="hidden" id="pCancel">Cancel</button>
        </div>
      </form>
      <div id="famMsg"></div>
      <ul class="list" id="family"></ul>
    </section>

    <section>
      <h2>🎄 Kris Kringle exchange</h2>
      <div class="row">
        <select id="eventSelect"></select>
        <button id="newEvent">+ New exchange</button>
      </div>

      <form id="eventForm" class="hidden" style="margin-top:12px">
        <div class="row">
          <input type="text" id="eName" placeholder="Name, e.g. Christmas 2026" maxlength="100" required>
          <input type="date" id="eDate" style="flex:0 1 170px">
          <input type="text" id="eBudget" placeholder="Budget ($)" inputmode="decimal" style="flex:0 1 120px">
        </div>
        <div class="row" style="margin-top:8px">
          <button type="submit" class="primary" id="eSave">Save</button>
          <button type="button" id="eCancel">Cancel</button>
          <button type="button" class="link" id="eDelete">Delete this exchange</button>
        </div>
      </form>

      <div id="eventBody"></div>
      <div id="eventMsg"></div>
    </section>
  </div>

  <footer><span id="myLink"></span> <span class="family-footer"></span></footer>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const code = codeFromHash();
let state = null;          // { admin_id, people, events }
let selectedId = null;
let editingPersonId = null;
let editingEvent = null;   // null | "new" | event id
const revealed = new Set();

const personById = id => state.people.find(p => p.id === id);
const nameOf = id => personById(id)?.name ?? "(removed)";
const selected = () => state.events.find(e => e.id === selectedId);
const linkFor = p => new URL("./", location.href).href.replace(/index\.html$/, "") + "#" + p.access_code;

function emailSubject() { return `Your ${state.family} Kris Kringle link 🎄`; }

function inviteText(p) {
  return `Hi ${p.name}! 🎄 Here's your personal link for the ${state.family} family Kris Kringle. See who you're buying for and add your wish list:\n${linkFor(p)}\n\nIt's just for you, so don't share it!`;
}

// ---------- Draw engine (same as the original generator) ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Randomized backtracking, always expanding the giver with the fewest remaining options.
function generateDraw(people, rules) {
  const blocked = new Set(rules.map(r => r.giver + "|" + r.receiver));
  const allowed = new Map(people.map(g => [g, people.filter(r => r !== g && !blocked.has(g + "|" + r))]));
  const taken = new Set(), result = new Map();
  function solve() {
    if (result.size === people.length) return true;
    let best = null, bestOpts = null;
    for (const g of shuffle(people)) {
      if (result.has(g)) continue;
      const opts = allowed.get(g).filter(r => !taken.has(r));
      if (!bestOpts || opts.length < bestOpts.length) { best = g; bestOpts = opts; }
      if (opts.length === 0) return false;
    }
    for (const r of shuffle(bestOpts)) {
      result.set(best, r); taken.add(r);
      if (solve()) return true;
      result.delete(best); taken.delete(r);
    }
    return false;
  }
  return solve() ? people.map(g => ({ giver: g, receiver: result.get(g) })) : null;
}

// ---------- Loading ----------
async function load() {
  state = await rpc("admin_get_state", { p_code: code });
  if (!state.events.some(e => e.id === selectedId)) selectedId = state.events[0]?.id ?? null;
  render();
}

function render() {
  setFamily(state.family, "Admin");
  renderFamily();
  renderEvents();
  const me = personById(state.admin_id);
  $("myLink").innerHTML = me ? `<a href="${esc(linkFor(me))}">My personal page</a> · ` : "";
  $("app").classList.remove("hidden");
}

// ---------- Family ----------
function renderFamily() {
  $("famCount").textContent = `${state.people.length} ${state.people.length === 1 ? "person" : "people"}`;
  $("family").innerHTML = state.people.map(p => `
    <li>
      <div style="flex:1 1 200px">
        <strong>${esc(p.name)}</strong>${p.is_admin ? ` <span class="muted">(admin)</span>` : ""}
        <div class="muted">${[p.email, p.phone].filter(Boolean).map(esc).join(" · ") || "No contact details"} · 🎁 ${p.wish_count} wish${p.wish_count === 1 ? "" : "es"}</div>
      </div>
      <div class="actions">
        <button class="small" data-act="copy" data-id="${p.id}">Copy link</button>
        ${p.email ? `<a class="btn small" href="mailto:${esc(p.email)}?subject=${encodeURIComponent(emailSubject())}&body=${encodeURIComponent(inviteText(p))}">Email</a>` : ""}
        ${p.phone ? `<a class="btn small" href="sms:${esc(p.phone.replace(/[^\d+]/g, ""))}?&body=${encodeURIComponent(inviteText(p))}">Text</a>` : ""}
        <button class="small" data-act="edit" data-id="${p.id}">Edit</button>
        <button class="small link" data-act="newlink" data-id="${p.id}" title="Use if a link was shared by mistake">New link</button>
        ${p.id === state.admin_id ? "" : `<button class="small link" data-act="toggleAdmin" data-id="${p.id}">${p.is_admin ? "Remove admin" : "Make admin"}</button>`}
        ${p.id === state.admin_id ? "" : `<button class="small link" data-act="remove" data-id="${p.id}">Remove</button>`}
      </div>
    </li>`).join("");
}

function resetPersonForm() {
  editingPersonId = null;
  $("personForm").reset();
  $("pSave").textContent = "Add person";
  $("pCancel").classList.add("hidden");
}

$("personForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("pSave").disabled = true;
  try {
    await rpc("admin_save_person", {
      p_code: code, p_id: editingPersonId, p_name: $("pName").value,
      p_email: $("pEmail").value || null, p_phone: $("pPhone").value || null,
    });
    showMsg($("famMsg"), editingPersonId ? "Saved ✓" : `Added ${$("pName").value.trim()} ✓`, "ok");
    resetPersonForm();
    await load();
    $("pName").focus();
  } catch (err) { showMsg($("famMsg"), err.message); }
  finally { $("pSave").disabled = false; }
});
$("pCancel").addEventListener("click", resetPersonForm);

$("renameFamily").addEventListener("click", async () => {
  const name = prompt("Family name (shown as \"The ___ Kris Kringle\"):", state.family);
  if (!name || !name.trim() || name.trim() === state.family) return;
  try { await rpc("admin_rename_family", { p_code: code, p_name: name }); await load(); }
  catch (err) { showMsg($("famMsg"), err.message); }
});

$("family").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const p = personById(btn.dataset.id);
  try {
    if (btn.dataset.act === "copy") {
      await navigator.clipboard.writeText(linkFor(p));
      btn.textContent = "Copied!"; setTimeout(() => btn.textContent = "Copy link", 1500);
    } else if (btn.dataset.act === "edit") {
      editingPersonId = p.id;
      $("pName").value = p.name; $("pEmail").value = p.email || ""; $("pPhone").value = p.phone || "";
      $("pSave").textContent = "Save changes"; $("pCancel").classList.remove("hidden");
      $("pName").focus();
    } else if (btn.dataset.act === "newlink") {
      if (!confirm(`Make a new link for ${p.name}? Their old link will stop working, so you'll need to send them the new one.`)) return;
      await rpc("admin_regenerate_code", { p_code: code, p_id: p.id });
      await load();
      showMsg($("famMsg"), `New link made for ${p.name}. Remember to send it to them.`, "ok");
    } else if (btn.dataset.act === "toggleAdmin") {
      const msg = p.is_admin
        ? `Remove admin access from ${p.name}? They'll keep their personal page.`
        : `Make ${p.name} an admin? They'll be able to manage the family and run the draw from their own link.`;
      if (!confirm(msg)) return;
      await rpc("admin_set_admin", { p_code: code, p_id: p.id, p_is_admin: !p.is_admin });
      await load();
      if (!p.is_admin) showMsg($("famMsg"), `${p.name} is now an admin. Their family admin page is admin.html with their personal code on the end, also linked from their personal page.`, "ok");
    } else if (btn.dataset.act === "remove") {
      if (!confirm(`Remove ${p.name} from the family list? Their wish list will be deleted, and any draw they're in will be reset.`)) return;
      await rpc("admin_delete_person", { p_code: code, p_id: p.id });
      await load();
    }
  } catch (err) { showMsg($("famMsg"), err.message); }
});

// ---------- Exchanges ----------
function renderEvents() {
  $("eventSelect").innerHTML = state.events.length
    ? state.events.map(ev => `<option value="${ev.id}" ${ev.id === selectedId ? "selected" : ""}>${esc(ev.name)}${ev.status === "drawn" ? " ✓ drawn" : ""}</option>`).join("")
    : `<option value="">No exchanges yet</option>`;
  $("eventSelect").disabled = !state.events.length;

  const ev = selected();
  $("eventForm").classList.toggle("hidden", editingEvent === null);
  $("eDelete").classList.toggle("hidden", editingEvent === "new" || !ev);
  if (editingEvent !== null) { $("eventBody").innerHTML = ""; return; }

  if (!ev) {
    $("eventBody").innerHTML = `<div class="empty">Create an exchange to get started, e.g. "Christmas ${new Date().getFullYear()}".</div>`;
    return;
  }

  const parts = new Set(ev.participants);
  const partList = state.people.filter(p => parts.has(p.id));
  const prev = previousDrawn(ev);
  const details = [ev.exchange_date && `🗓️ ${prettyDate(ev.exchange_date)}`, ev.budget_cents != null && `💰 ${money(ev.budget_cents)}`].filter(Boolean).join(" · ");

  $("eventBody").innerHTML = `
    <div class="row" style="margin-top:12px; justify-content:space-between">
      <span class="muted">${details || "No date or budget set"}</span>
      <button class="small" id="editEvent">Edit details</button>
    </div>

    <h3>Who's in? <span class="muted">(${partList.length} selected)</span></h3>
    <div class="chips">
      ${state.people.map(p => `<label class="chip"><input type="checkbox" data-part="${p.id}" ${parts.has(p.id) ? "checked" : ""}> ${esc(p.name)}</label>`).join("") || `<span class="empty">Add family members above first.</span>`}
    </div>
    <div class="row" style="margin-top:8px"><button class="small link" id="selAll">Select everyone</button></div>

    <h3>🚫 No-go pairs</h3>
    <div class="row">
      <select id="ruleA"><option value="">Person…</option>${partList.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <select id="ruleB"><option value="">can't draw…</option>${partList.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <button id="addRule">Add rule</button>
    </div>
    <div style="margin-top:6px"><label class="check"><input type="checkbox" id="ruleBoth" checked> Applies both ways (couples)</label></div>
    <ul class="list">${groupRules(ev.exclusions).map((r, i) => `
      <li><span>${esc(nameOf(r.a))} ${r.both ? "⇄" : "→"} ${esc(nameOf(r.b))} <span class="muted">${r.both ? "(won't draw each other)" : "(can't draw)"}</span></span>
      <button class="small link" data-rule="${i}">Remove</button></li>`).join("") || `<li class="empty">No restrictions.</li>`}
    </ul>

    <h3>🎅 The draw</h3>
    ${prev ? `<label class="check" style="margin-bottom:10px"><input type="checkbox" id="avoidPrev" checked> Avoid repeating matches from ${esc(prev.name)}</label>` : ""}
    <div class="row">
      <button class="primary" id="shake">${ev.status === "drawn" ? "Reshuffle the Santa hat" : "Shake the Santa hat"}</button>
      ${ev.status === "drawn" ? `<button class="link" id="clearDraw">Clear draw</button>` : ""}
    </div>
    ${ev.status === "drawn" ? drawHtml(ev) : ""}
  `;
}

function drawHtml(ev) {
  const rows = [...ev.assignments].sort((a, b) => nameOf(a.giver).localeCompare(nameOf(b.giver)));
  return `
    <div class="msg ok">✅ Drawn! Everyone can now see their match on their personal page. Send each person their link:</div>
    <table>${rows.map(a => {
      const p = personById(a.giver);
      const show = revealed.has(a.giver);
      return `<tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td class="arrow">→</td>
        <td>${show ? esc(nameOf(a.receiver)) : `<button class="small link" data-reveal="${a.giver}">•••••• peek</button>`}</td>
        <td style="text-align:right"><div class="actions" style="justify-content:flex-end">
          <button class="small" data-copy="${p.id}">Copy link</button>
          ${p.email ? `<a class="btn small" href="mailto:${esc(p.email)}?subject=${encodeURIComponent(emailSubject())}&body=${encodeURIComponent(inviteText(p))}">Email</a>` : ""}
          ${p.phone ? `<a class="btn small" href="sms:${esc(p.phone.replace(/[^\d+]/g, ""))}?&body=${encodeURIComponent(inviteText(p))}">Text</a>` : ""}
        </div></td>
      </tr>`;
    }).join("")}</table>
    <p class="muted">Matches stay hidden here so you can join in too. Only peek if you need to.</p>`;
}

// The most recent other exchange that has a draw, older than this one in list order.
function previousDrawn(ev) {
  const i = state.events.indexOf(ev);
  return state.events.slice(i + 1).find(e => e.assignments.length) || null;
}

// Collapse A→B + B→A into a single "both ways" line for display.
function groupRules(rules) {
  const out = [], seen = new Set();
  for (const r of rules) {
    const k = r.giver + "|" + r.receiver;
    if (seen.has(k)) continue;
    const both = rules.some(x => x.giver === r.receiver && x.receiver === r.giver);
    seen.add(k); if (both) seen.add(r.receiver + "|" + r.giver);
    out.push({ a: r.giver, b: r.receiver, both });
  }
  return out;
}

async function saveSetup(ev, participants, exclusions) {
  if (ev.status === "drawn" && !confirm("Changing the setup will clear the current draw, so you'll need to draw again. Continue?")) {
    renderEvents(); return;
  }
  try {
    await rpc("admin_set_event_setup", { p_code: code, p_event: ev.id, p_person_ids: participants, p_exclusions: exclusions });
    revealed.clear();
    await load();
  } catch (err) { showMsg($("eventMsg"), err.message); }
}

$("eventSelect").addEventListener("change", e => { selectedId = e.target.value; revealed.clear(); showMsg($("eventMsg"), ""); renderEvents(); });

$("newEvent").addEventListener("click", () => {
  editingEvent = "new";
  $("eventForm").reset();
  $("eName").value = `Christmas ${new Date().getFullYear()}`;
  renderEvents(); $("eName").focus();
});

$("eventForm").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    const id = await rpc("admin_save_event", {
      p_code: code, p_id: editingEvent === "new" ? null : editingEvent, p_name: $("eName").value,
      p_exchange_date: $("eDate").value || null,
      p_budget_cents: $("eBudget").value.trim() ? toCents($("eBudget").value) : null,
    });
    if (editingEvent === "new") {
      // Start new exchanges with everyone in, and carry over the most recent no-go pairs.
      const template = state.events[0];
      await rpc("admin_set_event_setup", {
        p_code: code, p_event: id, p_person_ids: state.people.map(p => p.id),
        p_exclusions: template ? template.exclusions : [],
      });
    }
    selectedId = id; editingEvent = null;
    await load();
  } catch (err) { showMsg($("eventMsg"), err.message); }
});
$("eCancel").addEventListener("click", () => { editingEvent = null; renderEvents(); });
$("eDelete").addEventListener("click", async () => {
  const ev = selected();
  if (!confirm(`Delete "${ev.name}" and its draw? This can't be undone. Wish lists are not affected.`)) return;
  try {
    await rpc("admin_delete_event", { p_code: code, p_id: ev.id });
    editingEvent = null; selectedId = null;
    await load();
  } catch (err) { showMsg($("eventMsg"), err.message); }
});

$("eventBody").addEventListener("click", async e => {
  const ev = selected();
  const t = e.target;

  if (t.id === "editEvent") {
    editingEvent = ev.id;
    $("eName").value = ev.name; $("eDate").value = ev.exchange_date || "";
    $("eBudget").value = ev.budget_cents != null ? ev.budget_cents / 100 : "";
    renderEvents(); return;
  }
  if (t.id === "selAll") { saveSetup(ev, state.people.map(p => p.id), ev.exclusions); return; }
  if (t.id === "addRule") {
    const a = $("ruleA").value, b = $("ruleB").value;
    if (!a || !b) return;
    if (a === b) { showMsg($("eventMsg"), "Pick two different people."); return; }
    const rules = [...ev.exclusions, { giver: a, receiver: b }];
    if ($("ruleBoth").checked) rules.push({ giver: b, receiver: a });
    saveSetup(ev, ev.participants, rules); return;
  }
  if (t.dataset.rule !== undefined) {
    const g = groupRules(ev.exclusions)[t.dataset.rule];
    const rules = ev.exclusions.filter(r => !(r.giver === g.a && r.receiver === g.b) && !(g.both && r.giver === g.b && r.receiver === g.a));
    saveSetup(ev, ev.participants, rules); return;
  }
  if (t.dataset.reveal) { revealed.add(t.dataset.reveal); renderEvents(); return; }
  if (t.dataset.copy) {
    await navigator.clipboard.writeText(linkFor(personById(t.dataset.copy)));
    t.textContent = "Copied!"; setTimeout(() => t.textContent = "Copy link", 1500); return;
  }
  if (t.id === "clearDraw") {
    if (!confirm("Clear this draw? People will see \"the draw hasn't happened yet\" until you draw again.")) return;
    try { await rpc("admin_clear_draw", { p_code: code, p_event: ev.id }); revealed.clear(); await load(); }
    catch (err) { showMsg($("eventMsg"), err.message); }
    return;
  }
  if (t.id === "shake") {
    if (ev.participants.length < 2) { showMsg($("eventMsg"), "Pick at least 2 people for the exchange."); return; }
    if (ev.status === "drawn" && !confirm("Reshuffle? Everyone's match will change. Only do this if nobody has looked yet!")) return;

    let rules = ev.exclusions, note = "";
    const prev = previousDrawn(ev);
    if (prev && $("avoidPrev")?.checked) {
      const withPrev = [...rules, ...prev.assignments];
      if (generateDraw(ev.participants, withPrev)) rules = withPrev;
      else note = ` (Couldn't avoid every match from ${prev.name}, so some repeats were allowed.)`;
    }
    const draw = generateDraw(ev.participants, rules);
    if (!draw) { showMsg($("eventMsg"), "No valid draw is possible with these no-go pairs. Remove a rule or add more people."); return; }
    t.disabled = true;
    try {
      await rpc("admin_save_draw", { p_code: code, p_event: ev.id, p_pairs: draw });
      revealed.clear();
      await load();
      showMsg($("eventMsg"), "🎉 Ho ho ho! The draw is saved." + note, "ok");
    } catch (err) { showMsg($("eventMsg"), err.message); t.disabled = false; }
  }
});

$("eventBody").addEventListener("change", e => {
  const id = e.target.dataset.part;
  if (!id) return;
  const ev = selected();
  const parts = e.target.checked ? [...ev.participants, id] : ev.participants.filter(x => x !== id);
  saveSetup(ev, parts, ev.exclusions);
});

// ---------- Start ----------
(async () => {
  if (!code) { showMsg($("error"), "Open this page with your admin link (it ends in #your-code)."); return; }
  try { await load(); }
  catch (e) { showMsg($("error"), e.message); }
})();
addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
